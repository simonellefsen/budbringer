<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="the postilion - A tiny spherical-planet mail-courier game" />
    <meta name="theme-color" content="#8ec9c2" />
    <title>the postilion</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #8ec9c2;
        font-family: 'Patrick Hand', cursive, system-ui;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #5ec9be;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.5s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader {
        width: 80px;
        height: 60px;
        position: relative;
      }
      .envelope {
        width: 80px;
        height: 55px;
        background: #fff;
        border: 4px solid #1a1a1a;
        border-radius: 4px;
        position: relative;
        animation: float 1s ease-in-out infinite;
      }
      .envelope::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 0;
        border-left: 36px solid transparent;
        border-right: 36px solid transparent;
        border-top: 28px solid #1a1a1a;
      }
      .envelope::after {
        content: '';
        position: absolute;
        top: 4px;
        left: 4px;
        right: 4px;
        height: 0;
        border-left: 32px solid transparent;
        border-right: 32px solid transparent;
        border-top: 24px solid #fff;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <div class="loader">
        <div class="envelope"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
