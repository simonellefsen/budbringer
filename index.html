<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="budbringer - A tiny spherical-planet mail-courier game" />
    <meta name="theme-color" content="#87CEEB" />
    <title>budbringer</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #5fbdb0;
        font-family: 'Patrick Hand', cursive, system-ui;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #5fbdb0 0%, #4a9e94 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.5s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading h1 {
        color: #1a1a1a;
        font-size: 3.5rem;
        letter-spacing: 0.05em;
        margin-bottom: 2rem;
        text-shadow: 
          3px 3px 0 #fff,
          -1px -1px 0 #fff,
          1px -1px 0 #fff,
          -1px 1px 0 #fff;
      }
      .loader {
        width: 50px;
        height: 40px;
        position: relative;
      }
      .loader::before {
        content: '✉️';
        font-size: 2.5rem;
        position: absolute;
        animation: bounce 0.6s ease infinite;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0) rotate(-5deg); }
        50% { transform: translateY(-15px) rotate(5deg); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <h1>budbringer</h1>
      <div class="loader"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
